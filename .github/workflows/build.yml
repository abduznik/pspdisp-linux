name: build

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libusb-1.0-0-dev libjpeg-dev \
            libx11-dev libxext-dev libwayland-dev wayland-protocols libwayland-bin \
            libpulse-dev libpipewire-0.3-dev libglib2.0-dev
      - name: Build host
        working-directory: linux-host
        run: make -j"$(nproc)"
      - name: Smoke test
        working-directory: linux-host
        run: ./pspdisp --help
      - uses: actions/upload-artifact@v4
        with:
          name: pspdisp-linux-x86_64
          path: linux-host/pspdisp
